
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Λογοσ Greek Wordle</title>
<style>
  :root{
    --color-background-primary:#ffffff;
    --color-background-secondary:#f3f3f5;
    --color-text-primary:#1a1a1b;
    --color-text-secondary:#6b6b73;
    --color-border-secondary:#d3d6da;
    --color-border-tertiary:#dcdfe4;
  }
  html,body{margin:0;padding:0;background:var(--color-background-primary);color:var(--color-text-primary)}
  body{min-height:100vh;font-family:'Clear Sans','Helvetica Neue',Arial,sans-serif}
</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  #app{font-family:'Clear Sans','Helvetica Neue',Arial,sans-serif;max-width:500px;margin:0 auto;padding:12px 8px 24px}
  #header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border-tertiary);padding:10px 0;margin-bottom:8px}
  #header h1{font-size:1.7rem;font-weight:700;letter-spacing:0.12rem;color:var(--color-text-primary);font-family:'Clear Sans','Helvetica Neue',Arial,sans-serif}
  .hdr-btns{display:flex;gap:4px}
  #settings-btn,#help-btn{background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--color-text-primary);padding:4px 7px;border-radius:4px}
  #settings-btn:hover,#help-btn:hover{background:var(--color-background-secondary)}
  #streak-bar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px;font-size:13px;color:var(--color-text-secondary)}
  .streak-item{display:flex;flex-direction:column;align-items:center;gap:1px}
  .streak-val{font-size:1.3rem;font-weight:700;color:var(--color-text-primary)}
  #msg-bar{min-height:28px;text-align:center;font-size:14px;font-weight:700;color:var(--color-text-primary);margin-bottom:4px;transition:opacity 0.3s}
  #board{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:12px}
  .row{display:flex;gap:5px}
  .tile{width:58px;height:58px;border:2px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-family:'Noto Serif',serif;font-weight:700;color:var(--color-text-primary);user-select:none;transition:border-color 0.1s}
  .tile.filled{border-color:var(--color-text-secondary);animation:pop 0.1s ease}
  .tile.correct{background:#538d4e;border-color:#538d4e;color:#fff}
  .tile.present{background:#b59f3b;border-color:#b59f3b;color:#fff}
  .tile.absent{background:#3a3a3c;border-color:#3a3a3c;color:#fff}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}10%,90%{transform:translateX(-4px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
  .row.shake{animation:shake 0.5s ease}
  @keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-24px)}60%{transform:translateY(-12px)}80%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  #keyboard{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}
  .kb-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  .key{min-width:36px;height:54px;border-radius:4px;border:none;background:var(--color-background-secondary);color:var(--color-text-primary);font-family:'Noto Serif',serif;font-weight:700;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 6px;transition:background 0.2s,color 0.2s;user-select:none}
  .key:hover{filter:brightness(1.1)}
  .key.wide{min-width:52px;font-family:'Clear Sans',sans-serif;font-size:0.7rem}
  .key.correct{background:#538d4e;color:#fff}
  .key.present{background:#b59f3b;color:#fff}
  .key.absent{background:#3a3a3c;color:#fff}

  #modal{background:var(--color-background-primary);border-radius:8px;padding:20px;max-width:480px;width:90%;max-height:90vh;overflow-y:auto;position:relative}

  #modal .close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--color-text-secondary)}
  .ch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:55vh;overflow-y:auto;margin-bottom:14px}
  .ch-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--color-border-tertiary);cursor:pointer;transition:border-color 0.2s,background 0.2s;font-size:13px;color:var(--color-text-primary)}
  .ch-item.active{border-color:#538d4e;background:#538d4e22}
  .ch-item input{accent-color:#538d4e;width:14px;height:14px;cursor:pointer}
  .len-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .len-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--color-border-tertiary);background:none;color:var(--color-text-primary);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
  .len-btn.active{border-color:#538d4e;background:#538d4e;color:#fff}
  .len-btn:hover:not(.active){background:var(--color-background-secondary)}
  #modal-start{width:100%;padding:11px;background:#538d4e;color:#fff;border:none;border-radius:6px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:'Clear Sans',sans-serif}
  #modal-start:hover{background:#6aaf5e}
  .ex-tile{width:42px;height:42px;border:2px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-family:'Noto Serif',serif;font-weight:700;color:var(--color-text-primary)}
  .ex-tile.correct{background:#538d4e;border-color:#538d4e;color:#fff}
  .ex-tile.present{background:#b59f3b;border-color:#b59f3b;color:#fff}
  .ex-tile.absent{background:#3a3a3c;border-color:#3a3a3c;color:#fff}
  #game-over-msg{display:none;text-align:center;padding:10px;background:var(--color-background-secondary);border-radius:8px;margin-bottom:8px}
  #game-over-msg .word{font-size:1.3rem;font-family:'Noto Serif',serif;font-weight:700;color:var(--color-text-primary)}

  #new-game-btn{display:none;width:100%;padding:10px;background:#538d4e;color:#fff;border:none;border-radius:6px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:'Clear Sans',sans-serif;margin-bottom:8px}

  .section-label{font-size:11px;font-weight:700;letter-spacing:0.08rem;color:var(--color-text-secondary);margin-bottom:8px;text-align:center}

function normalize(str){
  return [...str].map(c=>{const lc=c.toLowerCase();return DIACRITIC_MAP[lc]||DIACRITIC_MAP[c]||lc;}).join('').replace(/[^αβγδεζηθικλμνξοπρστυφχψω]/g,'');

function uniqForms(forms){
  const seen=new Set();
  const out=[];
  forms.forEach(f=>{
    const raw=(typeof f==='string' ? f : (f&&f.display)||'').trim();
    const norm=normalize(raw);
    if(!norm || seen.has(norm)) return;
    seen.add(norm);
    out.push({display:raw,norm});
  });
  return out;
}

function buildRegularVerbForms(n){
  if(n.endsWith('ομαι')) return presentMiddle(n.slice(0,-4));
  if(n.endsWith('αω')) return contractAlpha(n.slice(0,-2));
  if(n.endsWith('εω')) return contractEpsilon(n.slice(0,-2));
  if(n.endsWith('οω')) return contractOmicron(n.slice(0,-2));
  if(n.endsWith('μι')) return [n];
  if(n.endsWith('ω')) return presentActive(n.slice(0,-1));
  return [n];
}

function generateForms(base, meaning){
  const b=(base||'').split(',')[0].trim();
  const n=normalize(b);
  const forms=[b];

  if(INDECLINABLE.has(n)) return uniqForms(forms);

  if(PRONOUN_OVERRIDES[n]) return uniqForms(makeForms(forms, PRONOUN_OVERRIDES[n]));
  if(ADJECTIVE_OVERRIDES[n]) return uniqForms(makeForms(forms, ADJECTIVE_OVERRIDES[n]));
  if(NOMINAL_OVERRIDES[n]) return uniqForms(makeForms(forms, NOMINAL_OVERRIDES[n]));
  if(VERB_OVERRIDES[n]) return uniqForms(makeForms(forms, VERB_OVERRIDES[n]));

  const isVerb = /^I\b/.test(meaning.trim());
  if(isVerb){
    return uniqForms(makeForms(forms, buildRegularVerbForms(n)));
  }

  if(n.endsWith('της')) return uniqForms(makeForms(forms, forms1stMascEta(n.slice(0,-3))));
  if(n.endsWith('ης')) return uniqForms(makeForms(forms, forms1stEta(n.slice(0,-1))));
  if(n.endsWith('α')) return uniqForms(makeForms(forms, forms1stAlpha(n.slice(0,-1))));
  if(n.endsWith('η')) return uniqForms(makeForms(forms, forms1stEta(n.slice(0,-1))));
  if(n.endsWith('ος')) return uniqForms(makeForms(forms, forms2ndMasc(n.slice(0,-2))));
  if(n.endsWith('ον')) return uniqForms(makeForms(forms, forms2ndNeut(n.slice(0,-2))));
  if(n.endsWith('ων')) return uniqForms(makeForms(forms, irregular3rd(n.slice(0,-1), n, n.slice(0,-1)+'α', n.slice(0,-1)+'ες', n.slice(0,-1)+'ας')));

  return uniqForms(forms);
}


const EXPANDED_VOCAB = (() => {
  const out=[];
  const seen=new Set();
  VOCAB_RAW.forEach(([g,e,c])=>{
    const base=g.split(',')[0].trim();
    generateForms(base,e).forEach(form=>{
      const key=form.norm+'|'+c;
      if(seen.has(key)) return;
      seen.add(key);
      out.push({
        greek: form.display,
        base: form.display,
        lemma: base,
        norm: form.norm,
        meaning: form.display===base ? e : `${e} (form of ${base})`,
        chapter: c,
        len: [...form.norm].length
      });
    });
  });
  return out;
})();

const CHAPTERS = [...new Set(VOCAB_RAW.map(v=>v[2]))].sort((a,b)=>a-b);
let enabledChapters = new Set(CHAPTERS.filter(c=>c<=5));
let selectedLength = 'any';

// Stats
let stats = {streak:0,best:0,played:0,won:0};

function updateStatsUI(){
  document.getElementById('streak-val').textContent=stats.streak;
  document.getElementById('best-val').textContent=stats.best;
  document.getElementById('played-val').textContent=stats.played;
  document.getElementById('won-val').textContent=stats.played>0?Math.round(stats.won/stats.played*100)+'%':'0%';
}

function getPool(){
  let pool = EXPANDED_VOCAB.filter(w=>enabledChapters.has(w.chapter) && w.len>=3);
  if(selectedLength!=='any'){
    const len=parseInt(selectedLength);
    const filtered=pool.filter(w=>w.len===len);
    if(filtered.length>=3) return filtered;
  }
  const preferred=pool.filter(w=>w.len>=4&&w.len<=7);
  return preferred.length>=3?preferred:pool;
}

function getLengthCounts(){
  const pool = EXPANDED_VOCAB.filter(w=>enabledChapters.has(w.chapter)).map(w=>w.len);
  const counts={};
  pool.forEach(l=>{counts[l]=(counts[l]||0)+1;});
  return counts;
}

const GREEK_ROWS = [
  ['α','β','γ','δ','ε','ζ','η','θ','ι','κ'],
  ['λ','μ','ν','ξ','ο','π','ρ','σ','τ','υ'],
  ['⌫','φ','χ','ψ','ω','↵']
];

let target=null, targetNorm=null, targetMeaning=null, wordLen=0;
let guesses=[], currentGuess=[], gameOver=false, keyStates={};

function pickWord(){
  const pool=getPool();
  const entry=pool[Math.floor(Math.random()*pool.length)];
  target=entry.base;
  targetMeaning=entry.meaning;
  targetNorm=entry.norm;
  wordLen=[...targetNorm].length;
  console.log(`%cLOGOS 🏛 Answer: ${target} (${targetNorm}) — "${targetMeaning}" — lemma ${entry.lemma} — Ch.${entry.chapter} — ${wordLen} letters`,'color:#538d4e;font-weight:bold;font-size:14px');
}

function getTileSize(){
  const max=Math.min(58, Math.floor((window.innerWidth-60)/(wordLen+0.5)));
  return Math.max(38,Math.min(58,max));
}

function buildBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  guesses=[];
  const sz=getTileSize();
  for(let r=0;r<6;r++){
    const row=document.createElement('div');
    row.className='row';row.id='row-'+r;
    for(let c=0;c<wordLen;c++){
      const tile=document.createElement('div');
      tile.className='tile';tile.id=`tile-${r}-${c}`;
      tile.style.width=sz+'px';tile.style.height=sz+'px';
      tile.style.fontSize=(sz*0.5)+'px';
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function buildKeyboard(){
  const kb=document.getElementById('keyboard');
  kb.innerHTML='';
  GREEK_ROWS.forEach(row=>{
    const div=document.createElement('div');div.className='kb-row';
    row.forEach(k=>{
      const btn=document.createElement('button');
      btn.className='key'+(k==='⌫'||k==='↵'?' wide':'');
      btn.textContent=k;btn.dataset.key=k;
      btn.addEventListener('click',()=>handleKey(k));
      div.appendChild(btn);
    });
    kb.appendChild(div);
  });
}

function updateKeyboard(){
  document.querySelectorAll('.key').forEach(btn=>{
    const k=btn.dataset.key;
    if(keyStates[k]) btn.className='key'+(k==='⌫'||k==='↵'?' wide':'')+' '+keyStates[k];
  });
}

function showMsg(msg,duration=1800){
  const bar=document.getElementById('msg-bar');
  bar.textContent=msg;bar.style.opacity=1;
  if(duration>0) setTimeout(()=>{bar.style.opacity=0;},duration);
}

function handleKey(k){
  if(gameOver) return;
  if(k==='⌫'){if(currentGuess.length>0) currentGuess.pop();}
  else if(k==='↵'){submitGuess();return;}
  else{if(currentGuess.length<wordLen) currentGuess.push(k);}
  renderCurrent();
}

function renderCurrent(){
  const rowIdx=guesses.length;
  for(let c=0;c<wordLen;c++){
    const tile=document.getElementById(`tile-${rowIdx}-${c}`);
    tile.textContent=currentGuess[c]||'';
    tile.className='tile'+(currentGuess[c]?' filled':'');
  }
}

function submitGuess(){
  if(currentGuess.length<wordLen){showMsg('Not enough letters');shakeRow(guesses.length);return;}
  const guessStr=currentGuess.join('');
  const result=scoreGuess(guessStr,targetNorm);
  revealGuess(guesses.length,guessStr,result,()=>{
    guesses.push(guessStr);
    result.forEach((r,i)=>{
      const k=guessStr[i];
      const pri={correct:3,present:2,absent:1};
      if(!keyStates[k]||pri[r]>pri[keyStates[k]]) keyStates[k]=r;
    });
    updateKeyboard();
    currentGuess=[];
    if(result.every(r=>r==='correct')){
      gameOver=true;
      setTimeout(()=>{
        bounceRow(guesses.length-1);
        const msgs=['Brilliant!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'];
        showMsg(msgs[guesses.length-1]||'Correct!',2200);
        stats.streak++;stats.best=Math.max(stats.best,stats.streak);stats.played++;stats.won++;
        updateStatsUI();
        endGame(true);
      },200);
    } else if(guesses.length===6){
      gameOver=true;
      setTimeout(()=>{
        stats.streak=0;stats.played++;
        updateStatsUI();
        endGame(false);
      },400);
    }
  });
}

function scoreGuess(guess,answer){
  const gl=[...guess],al=[...answer];
  const res=Array(gl.length).fill('absent');
  const used=Array(al.length).fill(false);
  for(let i=0;i<gl.length;i++) if(gl[i]===al[i]){res[i]='correct';used[i]=true;}
  for(let i=0;i<gl.length;i++){
    if(res[i]==='correct') continue;
    for(let j=0;j<al.length;j++){
      if(!used[j]&&gl[i]===al[j]){res[i]='present';used[j]=true;break;}
    }
  }
  return res;
}

function revealGuess(rowIdx,guess,result,cb){
  const chars=[...guess];
  chars.forEach((ch,i)=>{
    const tile=document.getElementById(`tile-${rowIdx}-${i}`);
    setTimeout(()=>{
      tile.style.transition=`transform 0.3s ease`;
      tile.style.transform='rotateX(-90deg)';
      setTimeout(()=>{
        tile.textContent=ch;tile.className=`tile ${result[i]}`;tile.style.transform='rotateX(0deg)';
      },150);
    },i*150);
  });
  setTimeout(cb,chars.length*150+320);
}

function shakeRow(rowIdx){
  const row=document.getElementById('row-'+rowIdx);
  row.classList.add('shake');setTimeout(()=>row.classList.remove('shake'),500);
}

function bounceRow(rowIdx){
  for(let c=0;c<wordLen;c++){
    const tile=document.getElementById(`tile-${rowIdx}-${c}`);
    setTimeout(()=>{tile.style.animation='bounce 0.8s ease';setTimeout(()=>tile.style.animation='',800);},c*100);
  }
}

function endGame(won){
  document.getElementById('game-over-msg').style.display='block';
  document.getElementById('go-word').textContent=target;
  document.getElementById('go-meaning').textContent=targetMeaning;
  document.getElementById('new-game-btn').style.display='block';
  if(!won) showMsg('The answer was: '+target,0);
}

function newGame(){
  gameOver=false;currentGuess=[];keyStates={};
  document.getElementById('game-over-msg').style.display='none';
  document.getElementById('new-game-btn').style.display='none';
  document.getElementById('msg-bar').textContent='';
  pickWord();buildBoard();buildKeyboard();
}

function showSettings(){
  const overlay=document.getElementById('overlay');
  document.getElementById('modal-title').textContent='SETTINGS';
  const counts=getLengthCounts();
  const available=[3,4,5,6,7].filter(l=>(counts[l]||0)>=3);

  let html='<div class="section-label">WORD LENGTH</div>';
  html+='<div class="len-row">';
  html+=`<button class="len-btn${selectedLength==='any'?' active':''}" onclick="setLen('any')">Any</button>`;
  available.forEach(l=>{
    html+=`<button class="len-btn${selectedLength==l?' active':''}" onclick="setLen(${l})">${l} letters <span style="font-size:10px;opacity:0.7">(${counts[l]})</span></button>`;
  });
  html+='</div>';

  html+='<div class="section-label" style="margin-top:8px">CHAPTERS</div>';
  html+='<div class="ch-grid">';
  CHAPTERS.forEach(c=>{
    const count=EXPANDED_VOCAB.filter(v=>v.chapter===c).length;
    html+=`<label class="ch-item${enabledChapters.has(c)?' active':''}" id="ch-lbl-${c}">
      <input type="checkbox" ${enabledChapters.has(c)?'checked':''} onchange="toggleChapter(${c},this.checked)">
      Ch.${c} <span style="font-size:10px;color:var(--color-text-secondary)">(${count})</span>
    </label>`;
  });
  html+='</div>';
  html+='<button id="modal-start" onclick="startFromSettings()">Start New Game</button>';
  document.getElementById('modal-body').innerHTML=html;
  overlay.style.display='flex';
}

function setLen(l){
  selectedLength=l;
  document.querySelectorAll('.len-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim().startsWith(l==='any'?'Any':l+''));
  });
}

function toggleChapter(c,checked){
  if(checked) enabledChapters.add(c); else enabledChapters.delete(c);
  const lbl=document.getElementById('ch-lbl-'+c);
  if(lbl) lbl.className='ch-item'+(enabledChapters.has(c)?' active':'');
  if(enabledChapters.size===0){
    enabledChapters.add(c);
    const inp=document.querySelector(`#ch-lbl-${c} input`);
    if(inp) inp.checked=true;
    if(lbl) lbl.className='ch-item active';
  }
  // refresh length buttons since pool changed
  const counts=getLengthCounts();
  document.querySelectorAll('.len-btn').forEach(b=>{
    const t=b.textContent.trim();
    if(t==='Any') return;
    const l=parseInt(t);
    const ok=(counts[l]||0)>=3;
    b.disabled=!ok;b.style.opacity=ok?1:0.4;
    if(!ok&&selectedLength==l){selectedLength='any';b.classList.remove('active');document.querySelector('.len-btn').classList.add('active');}
  });
}

function startFromSettings(){
  document.getElementById('overlay').style.display='none';
  newGame();
}

function showHelp(){
  document.getElementById('modal-title').textContent='HOW TO PLAY';
  document.getElementById('modal-body').innerHTML=`
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:12px">Guess the Greek word in 6 tries. After each guess, colors reveal how close you were.</p>
    <div style="display:flex;gap:4px;margin:8px 0">
      <div class="ex-tile correct">κ</div><div class="ex-tile">α</div><div class="ex-tile">λ</div><div class="ex-tile">ο</div><div class="ex-tile">σ</div>
    </div>
    <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px"><b>κ</b> is in the correct spot.</p>
    <div style="display:flex;gap:4px;margin:8px 0">
      <div class="ex-tile">λ</div><div class="ex-tile present">ε</div><div class="ex-tile">γ</div><div class="ex-tile">ω</div>
    </div>
    <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px"><b>ε</b> is in the word but wrong spot.</p>
    <div style="display:flex;gap:4px;margin:8px 0">
      <div class="ex-tile">π</div><div class="ex-tile">α</div><div class="ex-tile absent">σ</div>
    </div>
    <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:14px"><b>σ</b> is not in the word at all.</p>
    <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px">Diacritics are ignored — type bare letters. Inflected noun and verb forms are now included too. Use ⚙ to choose chapters and word length.</p>
    <br><button id="modal-start" onclick="document.getElementById('overlay').style.display='none'">Got it!</button>
  `;
  document.getElementById('overlay').style.display='flex';
}

document.getElementById('settings-btn').addEventListener('click',showSettings);
document.getElementById('help-btn').addEventListener('click',showHelp);
document.getElementById('modal-close').addEventListener('click',()=>document.getElementById('overlay').style.display='none');
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))document.getElementById('overlay').style.display='none';});
document.getElementById('new-game-btn').addEventListener('click',newGame);
document.addEventListener('keydown',e=>{
  if(document.getElementById('overlay').style.display!=='none') return;
  if(e.key==='Backspace') handleKey('⌫');
  else if(e.key==='Enter') handleKey('↵');
});

updateStatsUI();
newGame();
</script>

</body>
</html>
